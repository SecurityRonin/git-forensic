name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@9234e1fa9f85b14a8d6fddc7a8f7378f7e30b183
    with:
      # This repo had NO coverage job at all, so there is no existing decision
      # to carry across — and inheriting the default strict gate blind would be
      # a new, failing requirement rather than an adoption. The floor is the
      # measured status quo: `cargo llvm-cov --workspace --all-features
      # --summary-only` reports 89.38% line coverage (1299 lines, 138 missed)
      # on this commit, so 89 is where the repo already stands.
      # `floor` is a migration state, not the standard: an aggregate cannot
      # honour a per-line `// cov:unreachable` exemption. Raising this toward
      # strict is follow-up work, deliberately not bundled into adoption.
      coverage-gate: floor
      coverage-floor: 89
